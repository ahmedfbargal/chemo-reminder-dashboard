<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-H+DUYAX7PO1bvX6rap4JWpsfHB6aB0McdoULZWXC5U0='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hematology chemotherapy board · Layout preview</title>
<style>:root{
  --bg:#EDF1F4;--panel:#FFFFFF;--panel2:#F5F8FA;--ink:#102231;--muted:#5D6D7C;--line:#DCE3E9;--line2:#E8EDF1;
  --side:#0C2231;--side2:#133246;--sideink:#C9DCE7;--sidemuted:#7F9BAD;
  --accent:#0A7A85;--accentink:#FFFFFF;--accentsoft:#DCEFF0;
  --due:#9A5A00;--duebg:#FFEFD1;--miss:#BC2F35;--missbg:#FCE6E6;--ok:#1B7550;--okbg:#DFF3E8;--wait:#5B41A6;--waitbg:#ECE7FA;--plan:#0A6A74;--planbg:#DCEFF0;--na:#6B7782;--nabg:#ECEFF2;
  --c-vinca:#7A4DF0;--c-anthra:#D23F48;--c-aspa:#23966A;--c-ster:#CC8A0C;--c-it:#E0651A;--c-anti:#2D6BD3;--c-alky:#0F8C8A;
  --shadow:0 1px 2px rgba(16,34,49,.06),0 4px 14px rgba(16,34,49,.05);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A141C;--panel:#111F2A;--panel2:#162733;--ink:#E2ECF3;--muted:#91A4B3;--line:#22384A;--line2:#1C3040;
  --side:#07111A;--side2:#0F2231;--sideink:#C9DCE7;--sidemuted:#6F8A9C;
  --accent:#47C0C9;--accentink:#04232A;--accentsoft:#123A41;
  --due:#F3BD5E;--duebg:#3A2A0E;--miss:#F49BA0;--missbg:#3E191C;--ok:#86D3AE;--okbg:#122E21;--wait:#C5B5F5;--waitbg:#2A2244;--plan:#7FD4DA;--planbg:#123A41;--na:#9AA7B2;--nabg:#1D2C38;
  --c-vinca:#A98BFF;--c-anthra:#FF7A82;--c-aspa:#5FD3A1;--c-ster:#F1C15A;--c-it:#FF9B5C;--c-anti:#7AA7FF;--c-alky:#4FD0CD;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141C;--panel:#111F2A;--panel2:#162733;--ink:#E2ECF3;--muted:#91A4B3;--line:#22384A;--line2:#1C3040;
  --side:#07111A;--side2:#0F2231;--sideink:#C9DCE7;--sidemuted:#6F8A9C;
  --accent:#47C0C9;--accentink:#04232A;--accentsoft:#123A41;
  --due:#F3BD5E;--duebg:#3A2A0E;--miss:#F49BA0;--missbg:#3E191C;--ok:#86D3AE;--okbg:#122E21;--wait:#C5B5F5;--waitbg:#2A2244;--plan:#7FD4DA;--planbg:#123A41;--na:#9AA7B2;--nabg:#1D2C38;
  --c-vinca:#A98BFF;--c-anthra:#FF7A82;--c-aspa:#5FD3A1;--c-ster:#F1C15A;--c-it:#FF9B5C;--c-anti:#7AA7FF;--c-alky:#4FD0CD;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--font);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--sideink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 20px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#16A3AE,#0A6670);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.2}
.brand small{color:var(--sidemuted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--sideink);text-decoration:none;font-weight:500}
.nav a svg{opacity:.75;flex:none}
.nav a:hover{background:var(--side2)}
.nav a[aria-current="page"]{background:var(--side2);color:#fff}
.nav a[aria-current="page"] svg{opacity:1;color:#4FD3DC}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:#1E4560;color:#DDEFF6}
.nav .cnt.hot{background:#E7A023;color:#2A1A00}
.nav .cnt.red{background:#E2555B;color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #1B3A4F;font-size:12px;color:var(--sidemuted);line-height:1.6}
.side .foot b{color:var(--sideink);font-weight:600}
/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 28px}
.topin h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.asof{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;font-size:13px;color:var(--muted)}
.asof input{border:0;background:transparent;padding:4px 2px;color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.edit{background:var(--okbg);color:var(--ok)}.pill.ro{background:var(--nabg);color:var(--na)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.content{padding:22px 28px 70px;max-width:1240px;width:100%}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.warn{color:var(--miss)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .badge{background:#fff3;padding:0 6px;border-radius:999px;font-size:11.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.sechead h2{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.005em}
.sechead p{margin:0;color:var(--muted);font-size:13px}
.sechead .row{margin-left:auto}
h3{font-size:15px;margin:0;font-weight:700}
.muted{color:var(--muted)}.small{font-size:12.5px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi:hover{border-color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--line))}
.kpi.due{--k:var(--due)}.kpi.miss{--k:var(--miss)}.kpi.week{--k:var(--accent)}.kpi.wait{--k:var(--wait)}.kpi.q{--k:var(--c-ster)}
.kpi.due .v{color:var(--due)}.kpi.miss .v{color:var(--miss)}
/* runway */
.runway{padding:18px 20px 16px}
.track{display:grid;grid-template-columns:repeat(6,minmax(128px,1fr));position:relative}
.track::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:13px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--due))}
.stn{position:relative;padding:0 6px}
.stn .node{width:29px;height:29px;border-radius:50%;margin:0 auto;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;z-index:1}
.stn.t0 .node{border-color:var(--accent);background:var(--accent);color:var(--accentink)}
.stn.t5 .node{border-color:var(--due);background:var(--due);color:#fff;border-radius:8px;transform:rotate(45deg)}
.stn.t5 .node span{transform:rotate(-45deg)}
.stn .dl{text-align:center;margin-top:8px;font-weight:700;font-size:13.5px}
.stn .ds{text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px;min-height:18px}
.stn.t5 .ds{color:var(--due);font-weight:700}.stn.t0 .ds{color:var(--accent);font-weight:700}
.stn .items{display:flex;flex-direction:column;gap:5px}
.drug{all:unset;cursor:pointer;display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.3;padding:6px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2)}
.drug:hover{border-color:var(--muted)}
.drug:focus-visible{outline:2px solid var(--accent)}
.drug .cd{width:8px;height:8px;border-radius:3px;margin-top:4px;flex:none;background:var(--c)}
.drug b{font-weight:700}
.drug.miss{background:var(--missbg);border-color:transparent}
.drug.due{background:var(--duebg);border-color:transparent}
.none{font-size:12px;color:var(--muted);text-align:center;padding:6px 0}
.cls-vinca{--c:var(--c-vinca)}.cls-anthra{--c:var(--c-anthra)}.cls-aspa{--c:var(--c-aspa)}.cls-ster{--c:var(--c-ster)}.cls-it{--c:var(--c-it)}.cls-anti{--c:var(--c-anti)}.cls-alky{--c:var(--c-alky)}
/* grid two */
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.two.side300{grid-template-columns:minmax(0,1fr) 300px}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.t-due{background:var(--duebg);color:var(--due)}.t-miss{background:var(--missbg);color:var(--miss)}.t-sent{background:var(--okbg);color:var(--ok)}
.t-wait{background:var(--waitbg);color:var(--wait)}.t-plan{background:var(--planbg);color:var(--plan)}.t-na{background:var(--nabg);color:var(--na)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);vertical-align:middle;margin-right:6px}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel2)}
.sub{color:var(--muted);font-size:12px;line-height:1.45}
.dose b{font-weight:700}
.warnt{color:var(--miss);font-size:12px;font-weight:600}
/* alert */
.alert{border-color:color-mix(in srgb,var(--miss) 40%,var(--line));background:linear-gradient(0deg,var(--panel),var(--panel)) padding-box}
.alerthead{display:flex;gap:12px;align-items:flex-start;padding:16px 20px 6px}
.alerthead .ic{width:34px;height:34px;border-radius:10px;background:var(--missbg);color:var(--miss);display:grid;place-items:center;flex:none}
.alerthead h3{color:var(--miss)}
/* email card */
.mailcard{display:flex;gap:14px;align-items:center;padding:16px 18px}
.mailcard .ic{width:42px;height:42px;border-radius:12px;background:var(--duebg);color:var(--due);display:grid;place-items:center;flex:none}
.mailcard.ok .ic{background:var(--okbg);color:var(--ok)}
/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:11px 16px;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.empty{padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:500;color:var(--ink);width:100%}
textarea.input{min-height:70px;resize:vertical}
.search{max-width:260px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhead h2{margin:0 8px 0 0;font-size:18px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.month .wd{padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{all:unset;box-sizing:border-box;cursor:pointer;min-height:112px;padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:hover{background:var(--panel2)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell.out{background:color-mix(in srgb,var(--panel2) 70%,var(--bg))}
.cell.out .dn{color:var(--muted);opacity:.6}
.cell .dn{font-size:12.5px;font-weight:700}
.cell.today .dn{background:var(--accent);color:var(--accentink);border-radius:999px;padding:0 7px;align-self:flex-start}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .ev{display:flex;gap:5px;align-items:center;font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:5px;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ev .cd{width:6px;height:6px;border-radius:2px;background:var(--c);flex:none}
.cell .ev.miss{background:var(--missbg)}.cell .ev.due{background:var(--duebg)}.cell .ev.done{opacity:.55;text-decoration:line-through}
.cell .more{font-size:11px;color:var(--muted);font-weight:600}
.calgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12px;color:var(--muted);margin-top:12px}
/* patients */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--muted)}
.pcard:focus-visible{outline:2px solid var(--accent)}
.pcard .code{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pcard .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:12px;font-size:13px}
.pcard .meta span:nth-child(odd){color:var(--muted)}
.prog{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.phead{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;padding:20px 22px}
.phead .code{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:10px;font-size:13px}
.facts div span{display:block;color:var(--muted);font-size:12px}
.facts div b{font-weight:700}
.phase{margin-top:16px}
.phase .ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.items-check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.items-check{list-style:none;margin:0;padding:0}
.items-check li.done span{text-decoration:line-through;color:var(--muted)}
/* protocols */
.pr{margin-top:14px}
.prh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.reg{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.reg.A{background:#DCEFF0;color:#0A6A74}.reg.B{background:#E6E2FB;color:#5B41A6}.reg.C{background:#FDE8D8;color:#A2490F}
:root[data-theme="dark"] .reg.A{background:#123A41;color:#7FD4DA}:root[data-theme="dark"] .reg.B{background:#2A2244;color:#C5B5F5}:root[data-theme="dark"] .reg.C{background:#3A2412;color:#FFB27A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .reg.A{background:#123A41;color:#7FD4DA}:root:not([data-theme="light"]) .reg.B{background:#2A2244;color:#C5B5F5}:root:not([data-theme="light"]) .reg.C{background:#3A2412;color:#FFB27A}}
.q{border-top:1px solid var(--line2);padding:12px 20px;display:flex;gap:12px;align-items:flex-start}
.q .grow{flex:1;min-width:0}
.q.res .qt{color:var(--muted);text-decoration:line-through}
.prmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:12px 20px;font-size:13px;border-top:1px solid var(--line2)}
.prmeta span:nth-child(odd){color:var(--muted)}
/* email */
.mail{padding:22px 26px;white-space:pre-wrap;font-size:14px;line-height:1.6;max-width:80ch}
.mailsub{padding:16px 26px;border-bottom:1px solid var(--line);font-weight:700}
.mailsub small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.daylist .li{cursor:pointer}
.daylist .li:hover{background:var(--panel2)}
.daylist .li.sel{background:var(--accentsoft)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,18,27,.5);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 6vh) 14px 20px;z-index:60;overflow:auto}
.modal{background:var(--panel);border-radius:16px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.mh{display:flex;gap:10px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px}
.mb{padding:18px 22px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}

/* ===== attention list ===== */
.attlist{overflow:hidden}
.att{border-top:1px solid var(--line2)}.att:first-child{border-top:0}
.att>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}

.att .atic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.att.bad .atic{background:var(--missbg);color:var(--miss)}.att.warn .atic{background:var(--duebg);color:var(--due)}
.attx{flex:1;display:flex;flex-direction:column}
.chev{color:var(--muted);transition:transform .15s;font-size:18px}

.allclear{display:flex;gap:10px;align-items:center;color:var(--ok)}
/* ===== journey ===== */
.journey{padding:18px 20px;margin-top:16px}
.jold{font-size:13.5px;color:var(--wait);margin-top:4px;display:flex;gap:6px;align-items:center}

.jstop{flex:1;min-width:140px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 6px}
.jstop::before{content:"";position:absolute;top:19px;left:-50%;right:50%;height:6px;background:var(--line);border-radius:3px;z-index:0}
.jstop:first-child::before{display:none}
.jstop.done::before,.jstop.now::before{background:var(--gdot)}
.jdot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--panel2);border:3px solid var(--line);position:relative;z-index:1;color:var(--muted)}
.jstop.done .jdot{background:var(--gdot);border-color:var(--gdot);color:#fff}

function bsaEval(expr,W,H){const t=String(expr).replace(/\s+/g,'');let i=0;
  function num(){const m=/^\d+(\.\d+)?/.exec(t.slice(i));if(!m)throw new Error('number');i+=m[0].length;return parseFloat(m[0])}
  function prim(){if(t.startsWith('sqrt(',i)){i+=5;const v=sum();if(t[i]!==')')throw new Error(')');i++;return Math.sqrt(v)}const c=t[i];
    if(c==='('){i++;const v=sum();if(t[i]!==')')throw new Error(')');i++;return v}if(c==='-'){i++;return -prim()}
    if(c==='W'||c==='w'){i++;return W}if(c==='H'||c==='h'){i++;return H}return num()}
  function pw(){let v=prim();if(t[i]==='^'){i++;v=Math.pow(v,pw())}return v}
  function mul(){let v=pw();while(t[i]==='*'||t[i]==='/'){const o=t[i++];const r=pw();v=o==='*'?v*r:v/r}return v}
  function sum(){let v=mul();while(t[i]==='+'||t[i]==='-'){const o=t[i++];const r=mul();v=o==='+'?v+r:v-r}return v}
  if(!t)throw new Error('empty');const v=sum();if(i!==t.length||!isFinite(v))throw new Error('syntax');return v}

async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();toast(ok?'Copied':'Copy is blocked here; select the text instead')}}

/* ---------- saving ---------- */
function clearDraft(){try{sessionStorage.removeItem(draftKey)}catch(e){}}
async function saveAll(){
  if(!dirty)return;
  const button=document.querySelector('[data-act="save"]');
  if(button){button.disabled=true;button.textContent='Saving…'}
  const commit=()=>{
    if(localStorage.getItem(storageKey)!==baseRecord){
      toast('Another tab saved changes. Export this draft before reloading.');
      return;
    }
    const next=clone(S);
    next.rev=(saved.rev||0)+1;
    next.savedAt=stamp();
    const record=JSON.stringify(next);
    localStorage.setItem(storageKey,record);
    baseRecord=record;
    saved=next;S=clone(next);dirty=0;
    clearDraft();
    toast('Saved in this browser');
  };
  try{
    if(navigator.locks)await navigator.locks.request(storageKey,commit);
    else commit();
  }catch(e){toast('Browser storage could not save. Your draft is still open. Export data to keep a copy.')}
  render();
}
function importBoard(file){
  const reader=new FileReader();
  reader.onload=()=>{
    const previous=S, previousDirty=dirty;
    try{
      const incoming=readBoard(JSON.parse(reader.result));
      incoming.rev=saved.rev;
      incoming.savedAt=saved.savedAt;
      incoming.audit.push({at:stamp(),patient:null,text:'Imported data from '+file.name});
      S=incoming;dirty++;
      render();stash();
      toast('Data imported. Save to keep it.');
    }catch(e){
      S=previous;dirty=previousDirty;
      render();toast('That file is not a valid board export');
    }
  };
  reader.onerror=()=>toast('Could not read the selected file');
  reader.readAsText(file);
}

  if(t.id==='bf-expr'||t.id==='bf-w'||t.id==='bf-h'){const o=document.getElementById('bf-out');if(!o)return;try{const v=bsaEval(document.getElementById('bf-expr').value,+document.getElementById('bf-w').value,+document.getElementById('bf-h').value);o.textContent='= '+r2(v)+' m²'}catch(x){o.textContent='Cannot read the expression'}return}
  if(t.id&&t.id.startsWith('cc-')&&t.dataset.drug){const k=t.id.slice(3);const pv=document.getElementById('cp-'+k);if(pv){const v=pv.dataset.v;pv.innerHTML=concPrev(v===''?null:{v:+v,u:pv.dataset.u},parseFloat(t.value),false)}return}
  if(t.id==='ai-in'){AI.draft=t.value}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('modal').innerHTML)closeModal();
  if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='ai-in'){ev.preventDefault();aiSend();return}

/* ---------- AI editing assistant ---------- */
let SAMPLE=null;const AI={open:false,msgs:[],busy:false,proposal:null,ctl:null,draft:''};
const AIRULES='You are the editing assistant inside a hospital hematology chemotherapy dashboard used by clinical pharmacists. Reply ONLY with one JSON object: {"reply": string, "navigate": null or {"view": one of the listed views, "patient": a patient code or null}, "proposal": null or one proposal object}.\n'+
 'Proposal types (at most one per reply, and only when the user explicitly asks for a change):\n'+
 '1. {"type":"update_patient","patient":CODE,"changes":{FIELD:VALUE},"reason":string}. FIELD is one of name, mrn, age (text as recorded), ageYears (number), sex ("Male" or "Female"), weight (kg), height (cm), bsa (m²), diagnosis, protocol (text as written on the record), admission, status ("active" = confirmed, "awaiting" = awaiting approval, "held","completed","off").\n'+
 '2. {"type":"postpone","patient":CODE,"eventId":ID,"newDate":"YYYY-MM-DD","reason":string,"shiftLater":boolean}\n'+
 '3. {"type":"modify_dose","patient":CODE,"eventId":ID,"value":number,"unit":string,"reason":string}\n'+
 '4. {"type":"edit_event","patient":CODE,"eventId":ID,"changes":{"date"?: "YYYY-MM-DD","week"?: number,"route"?: string,"note"?: string},"reason":string}\n'+
 '5. {"type":"change_protocol","patient":CODE,"tpl":TEMPLATE_ID,"changeDate":"YYYY-MM-DD","newStart":"YYYY-MM-DD","reason":string}\n'+
 'Rules: Identify exactly one patient from the data by name (partial or Arabic spelling variants) or MRN. If there is no match or more than one possible match, ask in "reply" and set "proposal" to null. Pick the eventId from that patient\'s upcoming list only. Use only values the user stated: never calculate, suggest or choose a dose, BSA, date, reason or protocol yourself, and never make a clinical decision. If a needed value or the reason is missing, ask for it instead of proposing. A person must confirm every change; say so briefly. For questions, answer only from the data and say when it does not contain the answer. Use "navigate" to open a section when it helps. Write "reply" in the language the user wrote in, in at most three short sentences.';
function aiContext(){return JSON.stringify({today:asOf,views:VIEWS.map(v=>v[0]),templates:TPL.map(t=>({id:t.id,label:t.label})),
  patients:S.patients.map(p=>({code:p.code,name:p.name,mrn:p.mrn||null,diagnosis:p.diagnosis||null,age:p.age||null,ageYears:p.ageYears,sex:p.sex||null,weightKg:p.weight,heightCm:p.height,bsa:p.bsa,status:pstate(p).t,protocol:regOf(p),phase:curPhase(p),
    upcoming:p.events.filter(e=>e.remind&&live(e)&&e.date>=asOf).slice(0,10).map(e=>{const c=calc(e,p);return{eventId:e.id,drug:e.drug,date:e.date,week:e.week,dose:c.miss?null:c.v+' '+c.u}}),
    lastGiven:p.events.filter(e=>e.state==='administered').slice(-3).map(e=>({drug:e.drug,date:e.actualDate||e.date,week:e.week}))}))})}
const ISO=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)&&!isNaN(P(v));
function validateProposal(pr){
  if(!pr||typeof pr!=='object')return{err:'the proposal was empty'};const p=pt(pr.patient);if(!p)return{err:'no patient with code '+pr.patient};
  const reason=String(pr.reason||'').trim();if(!reason)return{err:'a reason is required; please state why'};
  const ev=()=>p.events.find(e=>e.id===pr.eventId);const rows=[];
  if(pr.type==='update_patient'){const ch=pr.changes||{};const allowed=['name','mrn','age','ageYears','sex','weight','height','bsa','diagnosis','protocol','admission','status'];const keys=Object.keys(ch);if(!keys.length)return{err:'no fields to change'};
    for(const k of keys){if(!allowed.includes(k))return{err:'field "'+k+'" cannot be edited here'};let v=ch[k];
      if(['ageYears','weight','height','bsa'].includes(k)){v=+v;const lim={ageYears:[0,99],weight:[1,200],height:[30,220],bsa:[0.2,3]}[k];if(!(v>=lim[0]&&v<=lim[1]))return{err:k+' value '+ch[k]+' is out of range'};ch[k]=v}
      if(k==='sex'&&!['Male','Female'].includes(v))return{err:'sex must be Male or Female'};if(k==='status'&&!['active','awaiting','held','completed','off'].includes(v))return{err:'unknown status'};
      rows.push([k,p[k]==null||p[k]===''?'—':p[k],ch[k]])}
    return{pr,p,rows,title:'Update patient details',reason}}
  if(pr.type==='postpone'){const e=ev();if(!e||!live(e)||!e.remind)return{err:'that treatment was not found among the patient’s upcoming doses'};if(!ISO(pr.newDate)||pr.newDate===e.date)return{err:'a valid new date is required'};
    rows.push(['Treatment',e.drug+', week '+e.week,''],['Date',fy(e.date),fy(pr.newDate)],['Later doses',' ',pr.shiftLater?'Move by the same number of days':'Unchanged'],['Patient status',pstate(p).t,'Delayed']);return{pr,p,e,rows,title:'Postpone treatment',reason}}
  if(pr.type==='modify_dose'){const e=ev();if(!e||!live(e))return{err:'that dose was not found among the patient’s upcoming doses'};const v=+pr.value;if(!(v>0))return{err:'a positive dose value is required'};const c=calc(e,p);
    rows.push(['Dose',e.drug+', week '+e.week+', '+fy(e.date),''],['Amount',(e.mod?e.mod.value:c.v)+' '+(c.u||''),v+' '+(pr.unit||c.u||'mg')]);return{pr,p,e,rows,title:'Record a dose modification',reason,clinical:true}}
  if(pr.type==='edit_event'){const e=ev();if(!e)return{err:'that treatment entry was not found'};const ch=pr.changes||{};const ks=Object.keys(ch);if(!ks.length)return{err:'no changes given'};
    for(const k of ks){if(!['date','week','route','note'].includes(k))return{err:'field "'+k+'" cannot be edited here'};if(k==='date'&&!ISO(ch[k]))return{err:'invalid date'};if(k==='week'&&!(Number.isInteger(+ch[k])&&+ch[k]>0&&+ch[k]<=200))return{err:'invalid week'};rows.push([k,k==='date'?fy(e.date):e[k],k==='date'?fy(ch[k]):ch[k]])}
    return{pr,p,e,rows,title:'Edit treatment entry ('+e.drug+', week '+e.week+')',reason}}
  if(pr.type==='change_protocol'){const t=TPLID[pr.tpl];if(!t)return{err:'unknown protocol template'};const cur=curPh(p);if(cur&&cur.reg===t.reg)return{err:'that is the same regimen; use Add next phase instead'};if(!ISO(pr.changeDate)||!ISO(pr.newStart))return{err:'valid change and day 1 dates are required'};
    rows.push(['Protocol',regOf(p)+', '+curPhase(p),t.label],['Change date','',fy(pr.changeDate)],['New day 1','',fy(pr.newStart)]);return{pr,p,rows,title:'Change protocol',reason,clinical:true}}
  return{err:'unknown change type'}}
function aiErr(e){const c=e&&e.code;return c==='not_granted'?'The assistant was not allowed to use Claude in this view.':c==='rate_limited'?'Too many requests just now. Try again in a moment.':c==='invalid_json'?'The answer could not be read. Please rephrase and try again.':c==='session_expired'?'Please sign in again.':c==='refused'?'That request was declined. Try rephrasing it.':'The assistant is unavailable right now. Try again shortly.'}
async function aiSend(){const t=document.getElementById('ai-in');const msg=(t&&t.value||'').trim();if(!msg||AI.busy||!SAMPLE)return;AI.msgs.push({role:'user',text:msg});AI.draft='';AI.busy=true;AI.proposal=null;renderAI();
  const convo=AI.msgs.slice(-8).map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.text).join('\n');
  const prompt=AIRULES+'\n\nDASHBOARD DATA (JSON):\n'+aiContext()+'\n\nCONVERSATION:\n'+convo+'\n\nReply to the last user message with the JSON object only.';
  AI.ctl=new AbortController();
  try{const r=await SAMPLE.json(prompt,{cache:false,signal:AI.ctl.signal});
    AI.msgs.push({role:'assistant',text:r&&typeof r.reply==='string'?r.reply:'(No reply)'});
    if(r&&r.navigate&&r.navigate.view&&VIEWS.some(v=>v[0]===r.navigate.view)){if(r.navigate.patient&&pt(r.navigate.patient))ui.patient=r.navigate.patient;if(location.hash==='#'+r.navigate.view)render();else location.hash=r.navigate.view}
    if(r&&r.proposal){const v=validateProposal(r.proposal);if(v.err)AI.msgs.push({role:'assistant',text:'I could not prepare that change: '+v.err+'.',warn:true});else AI.proposal=v}
  }catch(e){if(!e||e.code!=='cancelled')AI.msgs.push({role:'assistant',text:aiErr(e),warn:true});if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code))SAMPLE=null}
  AI.busy=false;AI.ctl=null;renderAI()}
function aiApply(){const v=AI.proposal;if(!v)return;if(!canWrite){toast('View only: changes need the owner signed in');return}const byEl=document.getElementById('ai-by');const by=byEl&&byEl.value.trim();if(!by){toast('Enter your name to confirm the change');return}
  const chk=validateProposal(v.pr);if(chk.err){AI.msgs.push({role:'assistant',text:'The data changed and the proposal is no longer valid: '+chk.err+'.',warn:true});AI.proposal=null;renderAI();return}
  setBy(by);const via='(via assistant, confirmed by '+by+')';const p=chk.p,pr=chk.pr;
  mutate(()=>{
    if(pr.type==='update_patient'){const ch=Object.assign({},pr.changes);if(ch.status){if(ch.status==='awaiting')setAwaiting(p,by+' '+via);else{if(!approved(p))setConfirmed(p,by);if(ch.status!==p.status){log(p,'Status '+p.status+' → '+ch.status+', by '+by+' '+via);p.status=ch.status}}delete ch.status}if(Object.keys(ch).length)applyPatientUpdate(p,ch,chk.reason,by,via)}
    if(pr.type==='postpone')applyPostpone(p,chk.e,pr.newDate,chk.reason,by,!!pr.shiftLater,via);
    if(pr.type==='modify_dose'){const c=calc(chk.e,p);applyModify(p,chk.e,+pr.value,pr.unit||c.u||'mg',asOf,chk.reason,by,'',via)}
    if(pr.type==='edit_event'){const e=chk.e;const ch=pr.changes;const out=[];if(ch.date&&ch.date!==e.date){const n=diff(ch.date,e.date);if(!e.origDate)e.origDate=e.date;e.date=ch.date;if(e.end)e.end=add(e.end,n);out.push('date → '+fy(ch.date))}if(ch.week){out.push('week '+e.week+' → '+ch.week);e.week=+ch.week}if(ch.route!=null){out.push('route → '+ch.route);e.route=ch.route}if(ch.note!=null){out.push('note');e.note=ch.note}p.events.sort((a,b)=>a.date.localeCompare(b.date));log(p,'Edited '+e.drug+' entry: '+out.join(', ')+' ('+chk.reason+') '+via)}
    if(pr.type==='change_protocol'){const cd=pr.changeDate,st=pr.newStart;const from=curPh(p)?'Regimen '+curPh(p).reg+' ('+curPh(p).label.replace(/^Regimen .: /,'')+')':(p.protocol||'Not set');const n=stopFrom(p,cd,'Stopped: protocol changed on '+fy(cd));p.phases.forEach(ph=>{if(!ph.superseded)ph.superseded=cd});
      const b=buildPhase(p.code,pr.tpl,st,2);p.phases.push(b.phase);p.events.push(...b.events);p.events.sort((x,y)=>x.date.localeCompare(y.date));const to='Regimen '+b.phase.reg+' ('+b.phase.label.replace(/^Regimen .: /,'')+')';p.protocol='UKALL 2011 Regimen '+b.phase.reg;
      p.protocolChanges.push({date:cd,from,to,reason:chk.reason,stopped:n,newStart:st,by});revokeIfApproved(p,'protocol changed');log(p,'Protocol changed on '+fy(cd)+': '+from+' → '+to+' ('+chk.reason+'); '+n+' future doses stopped '+via)}
  });
  AI.proposal=null;AI.msgs.push({role:'assistant',text:'Applied and recorded in the change history. Select Save changes to keep it for everyone.'});renderAI();toast('Change applied');}
function propCard(v){return'<div class="aiprop"><b>Proposed: '+esc(v.title)+'</b><div style="margin:4px 0">'+whoH(v.p)+'</div><table><thead><tr><th>Field</th><th>Now</th><th>Proposed</th></tr></thead><tbody>'+v.rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td dir="auto">'+esc(r[1])+'</td><td dir="auto"><b>'+esc(r[2])+'</b></td></tr>').join('')+'</tbody></table><div class="sub" style="margin-top:4px">Reason: '+esc(v.reason)+'</div>'+
  (canWrite?'<label class="field" style="margin-top:8px">Confirmed by (your name)<input id="ai-by" class="input" value="'+esc(lastBy())+'"></label><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn sm" data-act="aidiscard">Discard</button><button class="btn sm pri" data-act="aiapply">Apply change</button></div>':'<div class="sub" style="margin-top:6px">View only: sign in as the owner to apply changes.</div>')+'</div>'}
function renderAI(){let box=document.getElementById('aipanel');if(!box){box=document.createElement('div');box.id='aipanel';document.body.appendChild(box)}
  if(!SAMPLE){box.innerHTML='<button class="aibtn" data-act="assistant-info">'+icon('ai',18)+'<span>Assistant</span></button>';return}
  if(!AI.open){box.innerHTML='<button class="aibtn" data-act="ai">'+icon('ai',18)+'<span>Assistant</span></button>';return}
  box.innerHTML='<div class="aip" role="dialog" aria-label="Dashboard assistant"><div class="aih"><div style="flex:1"><b>Dashboard assistant</b><div class="sub">It proposes; you confirm. It never makes clinical decisions.</div></div><button class="btn sm ghost" data-act="ai" aria-label="Close assistant">✕</button></div><div class="aim" id="aim">'+
   (AI.msgs.length?'':'<div class="sub">Try “Update [patient]’s weight to 16 kg, reason: clinic scale today”, “What is [patient]’s next dose?” or “Open the pharmacy checklist”.</div>')+
   AI.msgs.map(m=>'<div class="aimsg '+m.role+(m.warn?' warn':'')+'" dir="auto">'+esc(m.text)+'</div>').join('')+(AI.busy?'<div class="aimsg assistant"><i>Thinking…</i></div>':'')+(AI.proposal?propCard(AI.proposal):'')+'</div>'+
   '<div class="aif"><textarea id="ai-in" class="input" rows="2" placeholder="Ask, or request a change…" dir="auto">'+esc(AI.draft)+'</textarea>'+(AI.busy?'<button class="btn" data-act="aistop">Stop</button>':'<button class="btn pri" data-act="aisend">Send</button>')+'</div></div>';
  const mm=document.getElementById('aim');if(mm)mm.scrollTop=mm.scrollHeight}
function autoConfirm(d,today){if(d.settings.autoConfirmPast===false)return 0;let n=0;
  d.patients.forEach(p=>{p.events.forEach(e=>{if(e.date<today&&!e.noAuto&&['scheduled','delayed','documented','unrecorded'].includes(e.state)&&!discOpen(e,p)){
    e.autoFrom=e.state;e.reason=(e.state==='documented'?'On the record sheet; ':e.state==='unrecorded'?'Not on the record sheet; ':'')+'confirmed by default (date passed, not marked otherwise)';e.state='administered';e.actualDate=e.actualDate||e.date;e.auto=true;n++}});
    if(p.status==='delayed'&&!p.events.some(e=>e.postponed&&e.state==='delayed'))p.status=p.prevStatus||'active'});return n}
function route(){ui.editK=null;const h=(location.hash||'').slice(1);ui.view=VIEWS.some(v=>v[0]===h)?h:'overview';if(ui.view!=='patients')ui.patient=null;closeModal();render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

try{
